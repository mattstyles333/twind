  - type: tips
    title: "Tips for Success"
    intro: "Follow these essential tips to ensure your home adjustments are safe and effective. Remember, when in doubt, it's always better to seek professional help."
    tips:
      - title: "1. Use Both Hands"
        items:
          - "Always put your glasses on and take them off with both hands"
          - "This keeps the frame balanced and prevents unnecessary bending"
      - title: "2. Avoid Overdoing It"
        items:
          - "Small, incremental adjustments are key"
          - "Over-bending can cause more harm than good, especially with plastic frames"
      - title: "3. Know Your Limits"
        items:
          - "If you're unsure, stop and seek professional help"
          - "Some adjustments require specialized tools and expertise"
      - title: "4. Test After Adjustments"
        items:
          - "Wear your glasses for a while to test the fit"
          - "Make additional small adjustments if needed"

  - type: checklist
    title: "Glasses Adjustment Checklist"
    intro: "Follow this quick checklist to ensure your glasses fit perfectly:"
    items:
      - "Check for slipping: Adjust temple arms downward"
      - "Test tightness: Loosen screws on metal frames if needed"
      - "Verify comfort: Wear for an hour and readjust"
      - "Seek help: Contact Spex4Less for professional adjustments"

  - type: contact
    title: "Want a hand?"
    content: "If you've purchased your glasses from Spex4Less, we're more than happy to help with any adjustments. Just give us a call at 0151 362 6611, and we'll take care of it for you. If you purchased your frames elsewhere, the store where you bought them from should be able to assist you with any necessary adjustments."

  - type: final
    title: "Final Thoughts"
    content: "With a little care and patience, you can make them fit perfectly—no headaches, no slipping, just a comfortable, snug pair of specs. Give these tips a try, and you'll be amazed at how much of a difference a few simple tweaks can make."