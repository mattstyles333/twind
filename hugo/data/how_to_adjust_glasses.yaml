    text:
      title: "Why Adjust Your Glasses at Home?"
      subtitle: "Have you ever experienced any of the following?"
      list:
        - "Glasses sliding down your nose constantly"
        - "Tight temple arms causing discomfort"
        - "Uneven fit affecting your vision"
        - "Frequent adjustments throughout the day"
      content: "Simple home adjustments can solve these common issues. Let's explore how."

  - type: text
    title: "What Are Home Glasses Adjustments?"
    content: "Home glasses adjustments are small modifications you can make to improve the fit and comfort of your frames. These adjustments focus on the temple arms (the parts that go behind your ears) and the nose pads. While professional adjustments are always recommended for major changes, these simple tweaks can provide immediate relief for common fit issues. The key is to be gentle and make incremental changes to avoid damaging your frames."

  - type: image
    src: "https://www.spex4less.com/media/mf_webp/jpg/media/wysiwyg/redesign/adjusting-arms.webp"
    alt: "Diagram showing proper glasses adjustment techniques"
    width: 1328
    height: 1200
    classes: "object-contain w-full transition-transform duration-300 ease-in-out"

  - type: solutions
    solutions:
      - number: 1
        title: "Glasses Sliding Down Your Nose?"
        description: "If your glasses keep slipping, there are small adjustments you can make, depending on whether you have plastic or metal frames."
        solution:
          title: "Solution"
          steps:
            - "Gently bend the temple arms downwards where they curve behind your ears"
            - "Be very careful with the pressure you apply to avoid breaking the frames"
            - "This helps them sit more securely on your face"
        safety:
          title: "Safety Tips"
          steps:
            - "Use both hands when adjusting"
            - "Make small, incremental changes"
            - "Stop if you feel resistance"

      - number: 2
        title: "Are the Arms of Your Glasses Too Tight?"
        description: "If the arms of your glasses feel too tight, they may need to be adjusted. However, these adjustments can only be made on metal frames."
        solution:
          title: "For Metal Frames"
          steps:
            - "You'll need a cross-head (Phillips) screwdriver"
            - "Place glasses upside down on a flat surface"
            - "Locate the screw on the inside of the arm near the lens"
            - "Gently loosen the screw while holding the arm steady"
        safety:
          title: "Important Notes"
          steps:
            - "Be careful not to loosen the screw too much"
            - "The screw on your glasses may differ from examples"
            - "Once loosened, adjust the arm to your desired fit"

