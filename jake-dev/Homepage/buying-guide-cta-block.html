<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spex4Less - Selling Points</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              p: "#1f2937",
              s: "#1E3A8A",
              l: "#f3f4f6",
              t: "#5494EC",
              a: "#f97316",
              b: "#2563eb",
              gr: "#6b7280",
            },
            screens: {
              xxsm: "420px",
              xxxsm: "360px",
            },
          },
        },
      };
    </script>
  </head>
<section class="px-2 py-6 md:px-4 lg:px-6 xl:px-12 md:py-8 lg:py-10 xl:py-12">
  <div class="mx-auto max-w-7xl">
    <div 
      class="relative overflow-hidden rounded-xl shadow-md aspect-[750/862] sm:aspect-[1280/550] lg:aspect-[1280/460]"
      style="border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); background-color: #5494EC;"
    >
      <!-- Background image - mobile only -->
      <img 
        src="{{media url='wysiwyg/homepageimages/buying-guide-sm_1_.png'}}" 
        alt="Buying Guide" 
        width="750" 
        height="1078" 
        loading="lazy"
        class="absolute inset-0 w-full h-full object-cover sm:hidden"
      />
      <!-- Background image - tablet and desktop -->
      <img 
        src="{{media url='wysiwyg/homepageimages/buying_guide.png'}}" 
        alt="Buying Guide" 
        width="1280" 
        height="460" 
        loading="lazy"
        class="absolute inset-0 w-full h-full object-cover hidden sm:block"
      />

      <div class="absolute inset-0 bg-black/50 sm:bg-black/20"></div>
      
      <!-- Content -->
      <div class="absolute inset-0 z-10 flex items-end sm:items-center justify-start">
        <div class="w-full h-full flex items-end sm:items-center p-4 pb-8 sm:p-0">
          <div class="w-full sm:mx-auto sm:max-w-7xl sm:px-6 md:px-8 lg:px-12 xl:px-16">
            <div class="text-left sm:max-w-[45%]">
              <h2 class="text-2xl sm:text-2xl md:text-3xl lg:text-4xl font-bold text-white mb-2 leading-tight">
                Shop Like an Expert.
              </h2>
              <h3 class="text-lg sm:text-lg md:text-xl lg:text-2xl font-semibold text-white/90 mb-4">
                Read the Buying Guide
              </h3>
              <p class="text-base sm:text-base md:text-lg text-white/90 mb-5 md:mb-6 leading-relaxed">
                From frame fit to lens options, our Buying Guide helps you shop with confidence.
              </p>
              <div class="flex justify-start">
                <a
                  href="{{store direct_url='buying-guide'}}"
                  class="inline-flex items-center justify-center px-5 py-2.5 md:px-6 md:py-3 rounded-lg border transition-all duration-200 bg-s border-s hover:bg-black text-white font-semibold text-sm md:text-base"
                >
                  Read the Guide
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
